# Builds Orknux Shell: the suite on the JVM, then native binaries for Linux and
# Windows, and the Linux binary run through the same integration test. A tag
# v* attaches both binaries and the jar to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            binary: orknux-shell
          - os: windows-latest
            name: windows-x64
            binary: orknux-shell.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Test and package
        shell: bash
        run: ./mvnw -B package

      # In GraalVM's Oracle Linux 8 image, not on the runner: a native image is
      # linked against the glibc of the machine that builds it, and built on the
      # runner's Ubuntu 24.04 the binary wanted glibc 2.34 and refused to start
      # on anything older than RHEL 9 or Ubuntu 22.04. Oracle Linux 8 is the
      # oldest system JDK 25 is supported on, and a binary built there asks for
      # nothing past glibc 2.17: it started in CentOS 7, Debian 10, Ubuntu 20.04
      # and Rocky 8 containers. scripts/build-native.sh uses the same image; a
      # change here is a change there.
      - name: Native image
        if: runner.os != 'Windows'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/graalvm/native-image-community:25-ol8 \
            -jar target/orknux-shell.jar -o target/orknux-shell

      # On Windows it is native-image.cmd, which Git Bash does not find by its bare name.
      - name: Native image (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: native-image.cmd -jar target\orknux-shell.jar -o target\orknux-shell

      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.binary }} --version

      # The conversation the suite has in-process, held by the binary instead.
      - name: Integration test against the binary
        if: runner.os == 'Linux'
        run: ./mvnw -B test -Dtest=IntegrationTest -Dorknux.shell.binary=$PWD/target/orknux-shell

      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/orknux-shell.exe dist/orknux-shell-${{ matrix.name }}.exe
          else
            cp target/orknux-shell dist/orknux-shell-${{ matrix.name }}
            cp target/orknux-shell.jar dist/orknux-shell.jar
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orknux-shell-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # What the installers check a download against before putting it in place.
      - name: Checksums and installers
        run: |
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum orknux-shell-* orknux-shell.jar > SHA256SUMS && cat SHA256SUMS)
      # A binary whose version is not its tag's would be offered to itself as
      # an update for ever: every Shell would install it, and still be older.
      - name: The tag is the version built
        run: |
          built="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          [ "v$built" = "$GITHUB_REF_NAME" ] || { echo "::error::pom.xml says $built and the tag is $GITHUB_REF_NAME"; exit 1; }

      # That version's section of CHANGELOG.md: the release notes here and on orknux.ai.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version" '$0==h {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section ## $version"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md

      # Self-update (orknux-server docs/orknux-ai/client-releases.graphql, section 4).
      # Each file is signed with the release key, whose public half every Shell
      # carries (release-keys.pem): orknux.ai stores the signature and cannot
      # make one, so a Shell installs only what this step signed. Each signature
      # is checked against that same file before anything is sent, so a secret
      # that does not match the key shipped fails here and not on every machine.
      #
      # Then declared once and sent file by file, each at the offset the site
      # says it has; declaring the same files again resumes, so a re-run job
      # carries on. The site publishes when the last byte of the last file has
      # arrived and every digest matched.
      - name: Offer it through orknux.ai
        env:
          TOKEN: ${{ secrets.ORKNUX_AI_PUBLISH_TOKEN }}
          SIGNING_KEY: ${{ secrets.ORKNUX_SHELL_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$TOKEN" ] || [ -z "$SIGNING_KEY" ]; then
            echo "::notice::ORKNUX_AI_PUBLISH_TOKEN or ORKNUX_SHELL_SIGNING_KEY is not set, so $version is not offered through orknux.ai and no Shell will update to it; it is on the GitHub release."
            exit 0
          fi
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          public=src/main/resources/io/mszymanski/orknux/shell/release-keys.pem
          declare -A files=(
            [linux-x64]=dist/orknux-shell-linux-x64
            [windows-x64]=dist/orknux-shell-windows-x64.exe
            [any]=dist/orknux-shell.jar
            [installer-sh]=dist/install.sh
            [installer-ps1]=dist/install.ps1
          )
          entries=()
          for platform in "${!files[@]}"; do
            file="${files[$platform]}"
            [ -f "$file" ] || { echo "::error::$file is missing"; exit 1; }
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$file" -out "$RUNNER_TEMP/sig"
            openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$file" -sigfile "$RUNNER_TEMP/sig" >/dev/null \
              || { echo "::error::ORKNUX_SHELL_SIGNING_KEY is not the key in release-keys.pem: no Shell would install this release"; exit 1; }
            entries+=("$(jq -n --arg p "$platform" --arg s "$(sha256sum "$file" | cut -d' ' -f1)" \
              --argjson n "$(stat -c %s "$file")" --arg g "$(base64 -w0 "$RUNNER_TEMP/sig")" \
              '{platform: $p, sha256: $s, size: $n, signature: $g}')")
          done
          rm -f "$key"
          printf '%s\n' "${entries[@]}" | jq -s --arg v "$version" --rawfile notes "$RUNNER_TEMP/notes.md" \
            '{version: $v, changelog: $notes, minimumServerVersion: null, files: .}' > "$RUNNER_TEMP/release.json"

          site="https://orknux.ai/api/client-releases/shell"
          answer="$(curl -sS --retry 4 --fail-with-body -X POST "$site" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' --data "@$RUNNER_TEMP/release.json")" \
            || { echo "::error::orknux.ai refused the release: $answer"; exit 1; }
          piece=$((90 * 1024 * 1024))
          for platform in "${!files[@]}"; do
            file="${files[$platform]}"
            size="$(stat -c %s "$file")"
            while [ "$(jq -r --arg p "$platform" '.files[] | select(.platform == $p) | .complete' <<<"$answer")" != "true" ]; do
              offset="$(jq -r --arg p "$platform" '.files[] | select(.platform == $p) | .received' <<<"$answer")"
              [ "$offset" -lt "$size" ] || { echo "::error::orknux.ai has every byte of $platform and has not completed it: $answer"; exit 1; }
              dd if="$file" of="$RUNNER_TEMP/piece" iflag=skip_bytes,count_bytes skip="$offset" count="$piece" status=none
              answer="$(curl -sS --retry 4 --fail-with-body -X PUT "$site/$version/files/$platform?offset=$offset" \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$RUNNER_TEMP/piece")" \
                || { echo "::error::orknux.ai refused $platform at $offset: $answer"; exit 1; }
            done
            echo "orknux.ai has $platform ($size bytes)"
          done
          [ "$(jq -r '.published' <<<"$answer")" = "true" ] || { echo "::error::every file was sent and orknux.ai has not published: $answer"; exit 1; }
          curl -sS "https://orknux.ai/api/clients/shell/latest?platform=linux-x64" | jq .
          echo "$version is offered through orknux.ai"
