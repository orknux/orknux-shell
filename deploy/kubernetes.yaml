# orknux-shell on Kubernetes — a sample to copy and adjust, not a chart.
#
# What matters in here:
#
#   - The token comes from a Secret. Make a real one first:
#       kubectl create secret generic orknux-shell --from-literal=token="orkx_$(openssl rand -hex 24)"
#     and give the same value to the Orknux side's MCP server credential.
#
#   - One replica. A session's workspace is a directory in this pod, so a
#     second replica behind one Service would send an agent's calls to a pod
#     that has never heard of its session. Scale by running one Deployment per
#     shell and registering each in Orknux, not by raising replicas.
#
#   - The resource numbers below are for the shell itself plus the commands it
#     runs, which is what actually costs. The native binary idles around
#     50–100Mi and a core is plenty for the server — everything above that is
#     headroom for agent commands (npm installs, builds, greps over trees).
#     Raise the limits if agents build real software in here; lower them for a
#     shell that only ever probes and lists.
#
#   - The filesystem is read-only except the two places writing belongs: /tmp,
#     where the session workspaces live, and the home directory, where node
#     and npm keep their caches. Both are emptyDirs, so they die with the pod
#     — which is what "throwaway workspace" means operationally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orknux-shell
  labels:
    app: orknux-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orknux-shell
  template:
    metadata:
      labels:
        app: orknux-shell
      annotations:
        # Prometheus needs the bearer token for /actuator/prometheus, so a
        # scrape config with `bearer_token` (or these annotations, where the
        # installation's Prometheus honours them plus its own secret handling)
        # is the way in. The health probes below are the only thing served
        # without it.
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8090"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: orknux-shell
          image: orknux-shell:latest # pin a real tag; latest follows main
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: ORKNUX_SHELL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orknux-shell
                  key: token
            # Uncomment to shorten how long an abandoned session keeps its
            # workspace; the default is 2h.
            # - name: ORKNUX_SHELL_SESSION_TIMEOUT
            #   value: 30m
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # The limit is really a budget for agent commands; see the note
              # at the top before copying these numbers.
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspaces
              mountPath: /tmp
            - name: home
              mountPath: /home/orknux
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
      volumes:
        - name: workspaces
          emptyDir:
            # The ceiling on every session put together; a runaway `dd` fills
            # this and evicts the pod rather than the node.
            sizeLimit: 2Gi
        - name: home
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orknux-shell
  labels:
    app: orknux-shell
spec:
  selector:
    app: orknux-shell
  ports:
    - name: http
      port: 8090
      targetPort: http
