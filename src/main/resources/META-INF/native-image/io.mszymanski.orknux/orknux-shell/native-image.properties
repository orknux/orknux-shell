# Orknux Shell's native image: one executable, no JVM fallback, HTTP(S) for the server.
# -march=compatibility so a binary built on a new CPU runs on an older one.
Args = --no-fallback \
       --enable-url-protocols=http,https \
       -march=compatibility \
       -H:+ReportExceptionStackTraces \
       --enable-native-access=ALL-UNNAMED
