# Every value an operator would want to change reads from the environment, with
# the development default beside it: `${ORKNUX_SHELL_SOMETHING:default}`. All
# prefixed the same way, so `env | grep ORKNUX_SHELL_` is the whole of an
# installation's configuration.
#
# The token has no default on purpose — the server refuses to start without
# one; see BearerAuth.

spring:
  application:
    name: orknux-shell

server:
  port: ${ORKNUX_SHELL_PORT:8090}

orknux-shell:
  version: @project.version@
  token: ${ORKNUX_SHELL_TOKEN:}
  shell: ${ORKNUX_SHELL_BINARY:/bin/sh}
  sessions-root: ${ORKNUX_SHELL_SESSIONS_ROOT:${java.io.tmpdir}/orknux-shell}
  session-timeout: ${ORKNUX_SHELL_SESSION_TIMEOUT:2h}
  command-timeout: ${ORKNUX_SHELL_COMMAND_TIMEOUT:10m}
  read-timeout: ${ORKNUX_SHELL_READ_TIMEOUT:5s}
  output-limit: ${ORKNUX_SHELL_OUTPUT_LIMIT:1000000}

management:
  endpoints:
    web:
      exposure:
        # Health for the probes, Prometheus for whoever is watching. The
        # probes answer without the token; the metrics need it — a Prometheus
        # scrape config carries it as `bearer_token`.
        include: health,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /readiness, for the descriptors in
        # deploy/kubernetes.yaml.
        enabled: true

logging:
  level:
    io.mszymanski: ${ORKNUX_SHELL_LOG_LEVEL:INFO}
